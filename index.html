<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dave Fontaine | Project Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(79,70,229,.08) 0%,transparent 50%),radial-gradient(circle at 70% 60%,rgba(124,58,237,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.container{max-width:720px;margin:0 auto;padding:40px 24px 60px;position:relative;z-index:1}
.header{text-align:center;margin-bottom:48px}
.header .monogram{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#4F46E5,#7c3aed);font-size:22px;font-weight:800;letter-spacing:-1px;margin-bottom:20px}
.header h1{font-size:32px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.header p{color:#9ca3af;font-size:15px;line-height:1.5}
.access-gate{background:#111;border:1px solid #222;border-radius:16px;padding:32px 28px;margin-bottom:40px;text-align:center}
.access-gate h2{font-size:18px;font-weight:700;margin-bottom:8px}
.access-gate p{color:#9ca3af;font-size:14px;margin-bottom:20px}
.access-input-row{display:flex;gap:10px;max-width:360px;margin:0 auto}
.access-input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:15px;outline:none;transition:border-color .2s}
.access-input:focus{border-color:#4F46E5}
.access-input::placeholder{color:#555}
.access-btn{padding:12px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#4F46E5,#7c3aed);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.access-btn:hover{opacity:.9}
.access-error{color:#ef4444;font-size:13px;margin-top:10px;display:none}
.projects-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#555;margin-bottom:16px;font-weight:600}
.projects{display:grid;gap:12px}
.project-card{display:flex;align-items:center;gap:16px;background:#111;border:1px solid #222;border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;text-decoration:none;color:#fff;position:relative;overflow:hidden}
.project-card:hover{border-color:#333;background:#161616;transform:translateY(-1px)}
.project-card.locked{opacity:.4;pointer-events:none;filter:blur(1px)}
.project-card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.project-card .info{flex:1;min-width:0}
.project-card .info h3{font-size:16px;font-weight:700;margin-bottom:3px}
.project-card .info p{color:#9ca3af;font-size:13px;line-height:1.4}
.project-card .arrow{color:#555;font-size:18px;flex-shrink:0;transition:color .2s}
.project-card:hover .arrow{color:#fff}
.project-card .tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:6px}
.tag-live{background:rgba(34,197,94,.15);color:#22c55e}
.tag-beta{background:rgba(234,179,8,.15);color:#eab308}
.tag-coming{background:rgba(107,114,128,.15);color:#6b7280}
.feedback-bar{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #222;padding:12px 24px;display:none;z-index:10}
.feedback-bar.show{display:flex;align-items:center;gap:12px;justify-content:center}
.feedback-input{flex:1;max-width:400px;padding:10px 14px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:14px;outline:none}
.feedback-input:focus{border-color:#4F46E5}
.feedback-send{padding:10px 20px;border-radius:8px;border:none;background:#4F46E5;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.feedback-close{background:none;border:none;color:#555;font-size:20px;cursor:pointer;padding:4px 8px}
.feedback-toggle{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#4F46E5,#7c3aed);border:none;color:#fff;font-size:22px;cursor:pointer;z-index:10;display:none;box-shadow:0 4px 20px rgba(79,70,229,.4);transition:transform .2s}
.feedback-toggle:hover{transform:scale(1.05)}
.feedback-toggle.show{display:flex;align-items:center;justify-content:center}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:#22c55e;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:100;transition:transform .3s;pointer-events:none}
.toast.visible{transform:translateX(-50%) translateY(0)}
.footer{text-align:center;margin-top:60px;color:#333;font-size:12px}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
  <div class="header">
    <div class="monogram">DF</div>
    <h1>Dave Fontaine</h1>
    <p>Builder. Investor. Advisor. Time Traveler.</p>
  </div>

  <div class="access-gate" id="accessGate">
    <h2>Welcome</h2>
    <p>Enter your access code to continue</p>
    <div class="access-input-row">
      <input class="access-input" id="accessCode" type="text" placeholder="Access code" autocomplete="off" autocapitalize="off">
      <button class="access-btn" onclick="checkAccess()">Enter</button>
    </div>
    <div style="color:#9ca3af;font-size:11px;margin-top:8px">Invite only — ask Dave for your code</div>
    <div class="access-error" id="accessError">Code not recognized. Check with Dave.</div>
  </div>

  <div id="projectsSection" style="display:none">
    <div class="projects-label">Projects</div>
    <div class="projects" id="projectsList"></div>
  </div>

  <div class="footer">davefontaine.ai</div>
</div>

<div class="toast" id="toast"></div>
<button class="feedback-toggle" id="feedbackToggle" onclick="toggleFeedback()">&#x1f4ac;</button>
<div class="feedback-bar" id="feedbackBar">
  <input class="feedback-input" id="feedbackInput" placeholder="Share your thoughts..." onkeydown="if(event.key==='Enter')sendFeedback()">
  <button class="feedback-send" onclick="sendFeedback()">Send</button>
  <button class="feedback-close" onclick="toggleFeedback()">&times;</button>
</div>

<script>
// === CONFIG: Dave edits this to control access ===
const PROJECTS = [
  {
    id: "disney",
    name: "Anderson Family Disney Guide",
    desc: "AI-powered Disney World trip planner for Kyle & Kaidy's family",
    icon: "\ud83c\udff0",
    iconBg: "#1e3a5f",
    url: "/disney/",
    tag: "live",
    // Who can access: list of access codes (lowercase)
    access: ["kyleanderson", "kaidyanderson", "kyle", "kaidy", "anderson"]
  },
  {
    id: "tagsale",
    name: "TagSale.ai",
    desc: "AI-powered selling concierge \u2014 snap, price, sell, get paid",
    icon: "\ud83d\udcf8",
    iconBg: "#059669",
    url: "https://tagsale.ai",
    tag: "live",
    access: ["tagsale", "investor", "builder"]
  },
  {
    id: "podcast",
    name: "The Dave Fontaine Podcast",
    desc: "AI-generated episodes on business, building, and figuring it out",
    icon: "\ud83c\udfa7",
    iconBg: "#4F46E5",
    url: "/podcast/",
    tag: "live",
    access: ["fbi", "fontaine", "fontainebros", "coo", "joel", "cfo", "val"]
  },
  {
    id: "millis",
    name: "Millis Middle/High School",
    desc: "Interactive proposal \u2014 Fontaine Bros for the Town of Millis",
    icon: "\ud83c\udfeb",
    iconBg: "#8c0032",
    url: "/millis/",
    tag: "live",
    access: ["millis", "fontaine", "fontainebros", "fbi", "joel", "griffin", "vertex", "tappe"]
  },
  {
    id: "needham",
    name: "Pollard Middle School, Needham",
    desc: "Interactive proposal \u2014 Fontaine + Dimeo JV for the Town of Needham",
    icon: "\ud83d\udc2f",
    iconBg: "#1a2744",
    url: "/needham/",
    tag: "live",
    access: ["needham", "pollard", "fontaine", "fontainebros", "fbi", "joel", "griffin", "dimeo"]
  },
  {
    id: "udor",
    name: "UDOR Studios",
    desc: "Venture studio \u2014 turning ideas into companies",
    icon: "\ud83d\ude80",
    iconBg: "#7c3aed",
    url: null,
    tag: "coming",
    access: ["investor", "partner"]
  }
];

// VIP codes see everything (no gate)
const VIP_CODES = ["vip", "dave", "davefontaine", "sarah", "beta"];

// Web3Forms key for feedback (same as TagSale)
const FEEDBACK_KEY = "e71b608c-ba69-4dc3-82d0-765910e81fc3";

// === STATE ===
let currentUser = null;
let feedbackOpen = false;

// Check URL params for auto-access
function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('access') || params.get('code') || params.get('a');
  if (code) {
    document.getElementById('accessCode').value = code;
    checkAccess(true);
  }
}

function checkAccess(silent) {
  const input = document.getElementById('accessCode').value.trim().toLowerCase().replace(/\s+/g, '');
  if (!input) return;

  const isVip = VIP_CODES.includes(input);
  const matchedProjects = PROJECTS.filter(p => isVip || p.access.includes(input));

  if (matchedProjects.length === 0) {
    if (!silent) {
      document.getElementById('accessError').style.display = 'block';
      document.getElementById('accessCode').style.borderColor = '#ef4444';
      setTimeout(() => {
        document.getElementById('accessError').style.display = 'none';
        document.getElementById('accessCode').style.borderColor = '#333';
      }, 3000);
    }
    return;
  }

  currentUser = input;
  document.getElementById('accessGate').style.display = 'none';
  document.getElementById('projectsSection').style.display = 'block';
  document.getElementById('feedbackToggle').classList.add('show');

  // Track the visit
  trackEvent('access', { user: currentUser, projects: matchedProjects.map(p => p.id) });

  renderProjects(matchedProjects, isVip);
}

function renderProjects(accessible, isVip) {
  const list = document.getElementById('projectsList');
  list.innerHTML = '';

  PROJECTS.forEach(project => {
    const hasAccess = isVip || accessible.find(p => p.id === project.id);
    const card = document.createElement('a');
    card.className = 'project-card' + (hasAccess ? '' : ' locked');
    if (hasAccess && project.url) {
      card.href = project.url;
      card.onclick = function() { trackEvent('project_click', { user: currentUser, project: project.id }); };
    }

    const tagClass = project.tag === 'live' ? 'tag-live' : project.tag === 'beta' ? 'tag-beta' : 'tag-coming';
    const tagLabel = project.tag === 'live' ? 'Live' : project.tag === 'beta' ? 'Beta' : 'Coming Soon';

    card.innerHTML = `
      <div class="icon" style="background:${project.iconBg}">${project.icon}</div>
      <div class="info">
        <h3>${project.name}</h3>
        <p>${project.desc}</p>
      </div>
      <span class="arrow">&rarr;</span>
      <span class="tag ${tagClass}">${tagLabel}</span>
    `;
    list.appendChild(card);
  });
}

function toggleFeedback() {
  feedbackOpen = !feedbackOpen;
  document.getElementById('feedbackBar').classList.toggle('show', feedbackOpen);
  document.getElementById('feedbackToggle').style.display = feedbackOpen ? 'none' : '';
  if (feedbackOpen) document.getElementById('feedbackInput').focus();
}

function sendFeedback() {
  const input = document.getElementById('feedbackInput');
  const msg = input.value.trim();
  if (!msg) return;

  // Send via Web3Forms
  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      access_key: FEEDBACK_KEY,
      subject: 'Hub Feedback from ' + (currentUser || 'anonymous'),
      from_name: currentUser || 'anonymous',
      message: msg,
      page: window.location.href
    })
  });

  input.value = '';
  toggleFeedback();
  showToast('Feedback sent! Thanks.');
  trackEvent('feedback', { user: currentUser, message: msg });
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2500);
}

function trackEvent(event, data) {
  // Simple tracking via Web3Forms (gets emailed to Dave)
  // For now, lightweight. Can upgrade to analytics later.
  fetch('https://api.web3forms.com/submit', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      access_key: FEEDBACK_KEY,
      subject: 'Hub Analytics: ' + event,
      from_name: 'davefontaine.ai tracker',
      message: JSON.stringify({ event, ...data, timestamp: new Date().toISOString(), ua: navigator.userAgent }),
      page: window.location.href
    })
  }).catch(() => {}); // silent fail
}

// Enter key on access input
document.getElementById('accessCode').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkAccess();
});

init();
</script>
</body>
</html>
