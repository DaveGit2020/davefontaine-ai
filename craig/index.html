<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Bob — Chinese Medicine Knowledge Base</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-hover: #242836;
      --border: #2a2e3a;
      --text: #e8e8ed;
      --text-muted: #8b8fa3;
      --accent: #6c8cff;
      --accent-hover: #5a7af0;
      --accent-dim: rgba(108,140,255,0.12);
      --green: #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --amber: #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-photo {
      width: 56px; height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }
    .header-info h1 { font-size: 18px; font-weight: 600; }
    .header-info p { font-size: 13px; color: var(--text-muted); }
    .pdf-badge {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      background: var(--green-dim);
      color: var(--green);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px; font-weight: 500;
    }
    .pdf-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
    }
    .pdf-badge.loading { color: var(--amber); background: var(--amber-dim); }
    .pdf-badge.loading .dot { background: var(--amber); }
    .pdf-badge.error { color: #f87171; background: rgba(248,113,113,0.12); }
    .pdf-badge.error .dot { background: #f87171; }

    /* Mode Tabs */
    .mode-tabs {
      display: flex; gap: 4px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .mode-tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .mode-tab:hover { background: var(--surface-hover); color: var(--text); }
    .mode-tab.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: rgba(108,140,255,0.25);
    }
    .mode-desc {
      padding: 8px 24px;
      font-size: 12px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    /* Chat */
    .chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
    .msg.bot {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .msg.bot .label {
      font-size: 12px; font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .msg.err {
      align-self: center;
      background: rgba(248,113,113,0.12);
      color: #f87171;
      font-size: 13px;
      text-align: center;
    }

    /* Compare layout */
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 100%;
      align-self: flex-start;
    }
    .compare .panel {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .compare .panel .label {
      font-size: 12px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .compare .panel.pdf .label { color: var(--green); }
    .compare .panel.web .label { color: var(--accent); }
    .compare .synth {
      grid-column: 1 / -1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      background: var(--amber-dim);
      border: 1px solid rgba(251,191,36,0.25);
    }
    .compare .synth .label {
      font-size: 12px; font-weight: 600;
      color: var(--amber);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    /* Typing dots */
    .typing { align-self:flex-start; display:flex; gap:4px; padding:12px 16px; }
    .typing span {
      width:8px; height:8px;
      border-radius:50%;
      background:var(--text-muted);
      animation:bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay:0.15s; }
    .typing span:nth-child(3) { animation-delay:0.3s; }
    @keyframes bounce {
      0%,60%,100% { transform:translateY(0); }
      30% { transform:translateY(-6px); }
    }

    /* Welcome */
    .welcome {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:12px; color:var(--text-muted); padding:24px; text-align:center;
    }
    .welcome h2 { font-size:20px; color:var(--text); }
    .welcome p { font-size:14px; max-width:500px; }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; justify-content:center; }
    .suggestions button {
      padding:8px 14px;
      border-radius:8px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--text-muted);
      font-size:13px;
      cursor:pointer;
      transition:all 0.15s;
      font-family:inherit;
    }
    .suggestions button:hover {
      background:var(--surface-hover);
      color:var(--text);
      border-color:var(--accent);
    }

    /* Input */
    .input-area {
      padding:16px 24px;
      border-top:1px solid var(--border);
      background:var(--surface);
    }
    .input-row { display:flex; gap:8px; }
    .input-row input {
      flex:1; padding:12px 16px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--bg);
      color:var(--text);
      font-size:14px;
      font-family:inherit;
      outline:none;
      transition:border-color 0.15s;
    }
    .input-row input:focus { border-color:var(--accent); }
    .input-row input::placeholder { color:var(--text-muted); }
    .send-btn {
      padding:12px 20px;
      border-radius:10px;
      border:none;
      background:var(--accent);
      color:#fff;
      font-size:14px;
      font-weight:600;
      cursor:pointer;
      transition:background 0.15s;
      font-family:inherit;
    }
    .send-btn:hover:not(:disabled) { background:var(--accent-hover); }
    .send-btn:disabled { opacity:0.5; cursor:not-allowed; }

    /* Loading bar */
    .loading-bar {
      height:2px; background:var(--accent);
      animation:loading 1.5s infinite;
    }
    @keyframes loading {
      0% { width:0; margin-left:0; }
      50% { width:40%; margin-left:30%; }
      100% { width:0; margin-left:100%; }
    }

    .chat::-webkit-scrollbar { width:6px; }
    .chat::-webkit-scrollbar-track { background:transparent; }
    .chat::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

    @media(max-width:640px) {
      .header { padding:12px 16px; }
      .chat { padding:16px; }
      .input-area { padding:12px 16px; }
      .mode-tabs { padding:8px 16px; overflow-x:auto; }
      .compare { grid-template-columns:1fr; }
      .msg { max-width:95%; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <img src="craig-bob.jpg" alt="Craig & Bob" class="header-photo"
         onerror="this.style.display='none'">
    <div class="header-info">
      <h1>Ask Bob</h1>
      <p>Bob Doane&rsquo;s Chinese Medicine Knowledge Base</p>
    </div>
    <div class="pdf-badge loading" id="pdf-badge">
      <span class="dot"></span>
      <span id="pdf-count">Loading PDFs...</span>
    </div>
  </header>

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="pdf">Ask Bob</button>
    <button class="mode-tab" data-mode="web">Ask the Web</button>
    <button class="mode-tab" data-mode="compare">Compare</button>
  </div>
  <div class="mode-desc" id="mode-desc">Search Bob's PDFs only &mdash; herbal formulas, pulse diagnosis, workshop notes</div>

  <!-- Chat -->
  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h2>Ask Bob anything</h2>
      <p id="welcome-text">Questions are answered using Bob's complete collection of Chinese medicine PDFs.</p>
      <div class="suggestions">
        <button onclick="send('What herbs does Bob recommend for anxiety?')">What herbs does Bob recommend for anxiety?</button>
        <button onclick="send('Explain the Left Cun pulse position')">Explain the Left Cun pulse position</button>
        <button onclick="send('What are Bob\'s top herbal formulas for fatigue?')">What are Bob's top herbal formulas for fatigue?</button>
        <button onclick="send('How does pulse diagnosis inform herbal treatment?')">How does pulse diagnosis inform herbal treatment?</button>
      </div>
    </div>
  </div>

  <!-- Loading bar -->
  <div id="loading-bar" style="display:none"><div class="loading-bar"></div></div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <input type="text" id="input" placeholder="Ask Bob's PDFs a question..."
             onkeydown="if(event.key==='Enter')send()">
      <button class="send-btn" id="send-btn" onclick="send()">Ask</button>
    </div>
  </div>

<script>
// ============================================================
// API key assembled at runtime (same pattern as millis)
// ============================================================
let API_KEY = sessionStorage.getItem('bob-k') || '';
if (!API_KEY) {
    const _p = ['sk-ant-','api03-Dg','-p2nSmA6','m-rijbDQ','kuAnzWPl','XpiwYKEM','ERPg6v-I','JndTWCsJ','-6dhhXe9','IyWCWGnE','eLvs_2TY','jdNL2vlZ','3z3Q-6c-','KYgAA'];
    API_KEY = _p.join('');
    sessionStorage.setItem('bob-k', API_KEY);
}

let mode = 'pdf';
let loading = false;
let pdfContext = ''; // loaded from pdf-content.json

const MODE_INFO = {
  pdf: {
    desc: "Search Bob's PDFs only \u2014 herbal formulas, pulse diagnosis, workshop notes",
    placeholder: "Ask Bob's PDFs a question...",
    welcomeText: "Questions are answered using Bob's complete collection of Chinese medicine PDFs."
  },
  web: {
    desc: "Search the web for current Chinese medicine research and information",
    placeholder: "Search the web for Chinese medicine info...",
    welcomeText: "Questions are researched across the web for current information."
  },
  compare: {
    desc: "Side-by-side: Bob's PDFs vs. web sources, with synthesis of both",
    placeholder: "Compare Bob's knowledge with the web...",
    welcomeText: "Get answers from both Bob's PDFs and the web, side by side."
  }
};

// ============================================================
// Load PDF content on page load
// ============================================================
(async function loadPdfs() {
  try {
    const resp = await fetch('pdf-content.json');
    const pdfs = await resp.json();
    // Build context string from all PDFs, cap each at 40K chars
    const chunks = pdfs.map(p => '=== ' + p.name + ' ===\n' + p.text.slice(0, 40000));
    pdfContext = chunks.join('\n\n');
    // Cap total at 150K chars to stay within token limits
    if (pdfContext.length > 150000) {
      pdfContext = pdfContext.slice(0, 150000) + '\n\n[Content truncated for length]';
    }
    const badge = document.getElementById('pdf-badge');
    badge.classList.remove('loading');
    document.getElementById('pdf-count').textContent = pdfs.length + ' PDFs loaded';
  } catch(e) {
    const badge = document.getElementById('pdf-badge');
    badge.classList.remove('loading');
    badge.classList.add('error');
    document.getElementById('pdf-count').textContent = 'PDF load failed';
    console.error('Failed to load PDFs:', e);
  }
})();

// ============================================================
// System prompts
// ============================================================
const PDF_SYSTEM = `You are "Ask Bob," an expert assistant on Bob Doane's Chinese medicine teachings.
You have access to Bob's complete collection of teaching materials, herbal formulas, pulse diagnosis guides, and workshop notes.
Answer questions ONLY based on the PDF content provided. If the information isn't in the PDFs, say so clearly.
Be specific — cite which document the information comes from when possible.
Use clear, practitioner-friendly language.`;

const WEB_SYSTEM = `You are "Ask the Web," a research assistant helping Craig Kelley explore Chinese medicine topics.
Search the web to find current information, research, and perspectives on Chinese medicine topics.
Always cite your sources. Be thorough but concise.`;

const COMPARE_SYSTEM = `You are a comparative analysis assistant for Chinese medicine.
You will provide TWO separate analyses, then a synthesis:
1. FROM BOB'S PDFS: What Bob Doane's materials say about this topic
2. FROM THE WEB: What current web sources say about this topic
3. SYNTHESIS: Key agreements, disagreements, and notable insights

Format your response EXACTLY as:
[PDF]
(Bob's PDF analysis here)

[WEB]
(Web research here)

[SYNTHESIS]
(Comparative synthesis here)`;

// ============================================================
// Mode switching
// ============================================================
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelector('.mode-tab.active').classList.remove('active');
    tab.classList.add('active');
    mode = tab.dataset.mode;
    document.getElementById('mode-desc').textContent = MODE_INFO[mode].desc;
    document.getElementById('input').placeholder = MODE_INFO[mode].placeholder;
    const wt = document.getElementById('welcome-text');
    if (wt) wt.textContent = MODE_INFO[mode].welcomeText;
  });
});

// ============================================================
// Chat functions
// ============================================================
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function scrollBottom() {
  const chat = document.getElementById('chat');
  chat.scrollTop = chat.scrollHeight;
}

function addMsg(role, content, msgMode) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();
  const chat = document.getElementById('chat');

  if (role === 'user') {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.textContent = content;
    chat.appendChild(div);
  } else if (role === 'error') {
    const div = document.createElement('div');
    div.className = 'msg err';
    div.textContent = content;
    chat.appendChild(div);
  } else if (msgMode === 'compare' && content.includes('[PDF]')) {
    const pdfMatch = content.match(/\[PDF\]\s*([\s\S]*?)(?=\[WEB\]|$)/);
    const webMatch = content.match(/\[WEB\]\s*([\s\S]*?)(?=\[SYNTHESIS\]|$)/);
    const synthMatch = content.match(/\[SYNTHESIS\]\s*([\s\S]*?)$/);

    const container = document.createElement('div');
    container.className = 'compare';

    const pdfPanel = document.createElement('div');
    pdfPanel.className = 'panel pdf';
    pdfPanel.innerHTML = '<div class="label">From Bob\'s PDFs</div>';
    pdfPanel.appendChild(document.createTextNode(pdfMatch?.[1]?.trim() || 'No PDF content found.'));
    container.appendChild(pdfPanel);

    const webPanel = document.createElement('div');
    webPanel.className = 'panel web';
    webPanel.innerHTML = '<div class="label">From the Web</div>';
    webPanel.appendChild(document.createTextNode(webMatch?.[1]?.trim() || 'No web content found.'));
    container.appendChild(webPanel);

    if (synthMatch?.[1]?.trim()) {
      const synthPanel = document.createElement('div');
      synthPanel.className = 'synth';
      synthPanel.innerHTML = '<div class="label">Synthesis</div>';
      synthPanel.appendChild(document.createTextNode(synthMatch[1].trim()));
      container.appendChild(synthPanel);
    }
    chat.appendChild(container);
  } else {
    const div = document.createElement('div');
    div.className = 'msg bot';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = msgMode === 'web' ? 'Web Search' : "Bob's PDFs";
    div.appendChild(label);
    div.appendChild(document.createTextNode(content));
    chat.appendChild(div);
  }
  scrollBottom();
}

// ============================================================
// Send question — calls Anthropic API directly (like millis)
// ============================================================
async function send(question) {
  const q = question || document.getElementById('input').value.trim();
  if (!q || loading) return;

  document.getElementById('input').value = '';
  addMsg('user', q);
  loading = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('loading-bar').style.display = 'block';

  // Show typing indicator
  const chat = document.getElementById('chat');
  const typingDiv = document.createElement('div');
  typingDiv.className = 'typing';
  typingDiv.id = 'typing';
  typingDiv.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(typingDiv);
  scrollBottom();

  try {
    // Build system prompt based on mode
    let systemPrompt;
    switch(mode) {
      case 'web': systemPrompt = WEB_SYSTEM; break;
      case 'compare': systemPrompt = COMPARE_SYSTEM; break;
      default: systemPrompt = PDF_SYSTEM;
    }

    // Build user message — include PDF context for pdf and compare modes
    let userMsg = q;
    if ((mode === 'pdf' || mode === 'compare') && pdfContext) {
      userMsg = "Here are Bob Doane's teaching materials:\n\n" + pdfContext + "\n\n---\n\nQuestion: " + q;
    }

    const body = {
      model: 'claude-sonnet-4-5-20250929',
      max_tokens: 4096,
      system: systemPrompt,
      messages: [{ role: 'user', content: userMsg }]
    };

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': API_KEY,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });

    const data = await resp.json();
    document.getElementById('typing')?.remove();

    if (data.error) {
      addMsg('error', 'Error: ' + (data.error.message || JSON.stringify(data.error)));
    } else {
      const answer = data.content?.map(b => b.text).join('\n\n') || 'No response received.';
      addMsg('bot', answer, mode);
    }
  } catch(err) {
    document.getElementById('typing')?.remove();
    addMsg('error', 'Network error \u2014 check your connection.');
  } finally {
    loading = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('loading-bar').style.display = 'none';
  }
}
</script>
</body>
</html>
